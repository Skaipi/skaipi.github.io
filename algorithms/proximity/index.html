---
custom_css: /algorithms/proximity/index.css
title: Proximity Graphs
layout: default
---
<div class="viz-wrapper">
  <svg id="viz"></svg>

  <div id="controls-panel">
    <h2>Controls</h2>

    <div class="mode-container">
      <label>
        <input id="bs" type="radio" name="mode" value="bs" checked>
        Beta Skeleton
      </label>
      
      <label>
        <input id="rng" type="radio" name="mode" value="rng">
        Relative Neighborhood
      </label>

      <label>
        <input id="nn" type="radio" name="mode" value="nn">
        Nearest Neighbors
      </label>

      <label>
        <input id="rknn" type="radio" name="mode" value="rknn">
        Ranked Neighbors
      </label>
    </div>

    <hr/>

    <div class="upload-container">
      <span class="drop-zone">CSV</span>
      <input type="file" name="csvFile" class="drop-zone-input">
    </div>
  </div>
</div>
<script src="./index.js" type="module" defer></script>
