---
custom_css: /algorithms/hnsw/index.css
title: HNSW Graph Visualizer
layout: default
---

<div class="canvas-wrapper">
  <canvas id="canvas" aria-label="Layered HNSW relative neighborhood graph visualization"></canvas>

  <div id="controls-panel">
    <h2>Controls</h2>

    <div class="palette-container" aria-labelledby="palette-heading">
      <p id="palette-heading" class="control-label">Color palette</p>

      <label>
      <input id="site-palette" type="radio" name="palette" value="site" checked />
        Default
      </label>

      <label>
        <input id="paper-palette" type="radio" name="palette" value="paper" />
        PDF
      </label>
    </div>

    <button id="download-render" type="button">Download PNG</button>
  </div>
</div>
<script src="./index.js" type="module" defer></script>
